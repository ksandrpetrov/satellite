# Локальная и CI проверка стиля/типов перед коммитом. См. AGENTS.md → «make check».
# Запуск: pre-commit install && pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies: ["cryptography==49.0.0"]
        args: ["--ignore-missing-imports"]
        files: ^satellite/
