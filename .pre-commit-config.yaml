# Быстрая проверка стиля перед коммитом. Запуск:
#   pre-commit install && pre-commit run --all-files
#
# mypy тут намеренно НЕТ. pre-commit ставит хуки в изолированный venv без
# caldav / icalendar / requests / Pillow, поэтому его пришлось бы гонять с
# --ignore-missing-imports — то есть против другого окружения, чем
# `make typecheck` и .github/workflows/_checks.yml, с другими вердиктами.
# Типы — блокирующий гейт в `make check` и в CI, на реальных зависимостях.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
