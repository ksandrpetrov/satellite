[project]
name = "satellite"
version = "0.0.0"
description = "Production Telegram bot 'Chaika': CalDAV → дайджест дня (см. AGENTS.md)"
requires-python = ">=3.11"

# Прямые зависимости задаются в requirements*.in, а установка идёт только из
# generated requirements*.txt (см. `make lock`). Здесь `pyproject.toml` нужен
# для Python baseline и конфигов инструментов; пакет в PyPI не публикуется.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".venv", "logs", "deploy", "scripts"]

[tool.ruff.lint]
# Базовый набор: pyflakes (F), pycodestyle (E/W), import-order (I), bugbear (B),
# pyupgrade (UP), simplify (SIM). Цель — дешёвые ошибки и мусор, не доводя до
# стилистических придирок. Несколько правил отключены глобально как слишком
# назойливые/контр-продуктивные для нашего кода (см. комментарии).
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # длинные строки — терпимо в комментариях/HTML
    "B008",   # `default=Foo()` в dataclass-аргументах — норма
    "B904",   # raise ... from — handler-слой подавляет first-error по дизайну
    "SIM102", # nested if — иногда читаемее
    "SIM103", # `return cond` — иногда явный `if` понятнее
    "SIM105", # contextlib.suppress — try/except/pass у нас как best-effort save
    "SIM108", # тернарник если возражает читабельность
    "SIM118", # `key in dict.keys()` — изредка для явности
]

[tool.ruff.lint.per-file-ignores]
# Re-export hub'ы: handlers/__init__ и пр. умышленно ре-экспортируют публичный API.
"satellite/telegram_bot/handlers/__init__.py" = ["F401"]
"satellite/messages_ru/__init__.py" = ["F401", "F403"]
"satellite/users/__init__.py" = ["F401"]
"satellite/calendar/events/__init__.py" = ["F401"]
"tests/**" = ["B", "SIM", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["satellite"]

# mypy теперь блокирующий гейт CI (см. .github/workflows/_checks.yml). Если
# где-то нужно подавить ложный позитив — точечный `# type: ignore[<code>]`
# с комментарием «почему».

[[tool.mypy.overrides]]
module = [
    "satellite.json_store",
    "satellite.users.store",
    "satellite.subscriptions.store",
    "satellite.scheduler",
    "satellite.services",
    "satellite.telegram_bot.bot",
    "satellite.telegram_bot.update_dispatcher",
]
# ``strict = true`` в mypy разворачивается как глобальный preset. Явный
# список тех же per-module флагов сохраняет строгий режим только здесь.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
