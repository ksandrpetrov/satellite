---
- name: Deploy Satellite (Docker, nginx — внешний на хосте)
  hosts: satellite
  gather_facts: true

  vars:
    satellite_image: "{{ ghcr_registry }}/{{ ghcr_image }}:{{ image_tag }}"
    satellite_repo_root: "{{ playbook_dir | dirname | dirname }}"
    webapp_base_url: "https://{{ domain }}/connect"

  pre_tasks:
    - name: Check for existing .env on server
      ansible.builtin.stat:
        path: "{{ deploy_dir }}/.env"
      register: deploy_env_stat

    - name: Read TOKEN_ENCRYPTION_KEY from existing .env
      ansible.builtin.shell: >-
        grep -m1 '^TOKEN_ENCRYPTION_KEY=' "{{ deploy_dir }}/.env" | cut -d= -f2- | tr -d '\r'
      register: existing_token_key
      changed_when: false
      failed_when: false
      when:
        - deploy_env_stat.stat.exists
        - (token_encryption_key | default('') | trim | length) == 0

    - name: Ensure TOKEN_ENCRYPTION_KEY
      ansible.builtin.set_fact:
        token_encryption_key_effective: >-
          {{
            token_encryption_key | trim
            if (token_encryption_key | default('') | trim | length) > 0
            else (
              existing_token_key.stdout | default('') | trim
              if (
                existing_token_key is defined
                and not (existing_token_key.skipped | default(false))
                and (existing_token_key.stdout | default('') | trim | length) > 0
              )
              else lookup(
                'pipe',
                'python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"'
              )
            )
          }}

    # До любого apt: на сервере мог остаться ручной install Docker (docker.gpg +
    # .list/.sources). Две записи с разным Signed-By ломают apt update_cache.
    - name: Remove stale Docker apt sources (conflicting Signed-By)
      ansible.builtin.shell: |
        set -euo pipefail
        shopt -s nullglob
        rm -f /etc/apt/keyrings/docker.gpg
        rm -f /etc/apt/sources.list.d/docker.list
        rm -f /etc/apt/sources.list.d/docker.sources
        rm -f /etc/apt/sources.list.d/download.docker.com*.list
        rm -f /etc/apt/sources.list.d/download.docker.com*.sources
        for f in /etc/apt/sources.list.d/*docker*; do
          rm -f "$f"
        done
      args:
        executable: /bin/bash
      changed_when: true
      when: ansible_facts["os_family"] == "Debian"

  tasks:
    - name: Install Docker prerequisites (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: false
      when: ansible_facts["os_family"] == "Debian"

    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_facts["os_family"] == "Debian"

    - name: Add Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/{{ ansible_facts["distribution"] | lower }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_facts["architecture"] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_facts["distribution"] | lower }}
          {{ ansible_facts["distribution_release"] }} stable
        filename: docker
        state: present
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create deploy directory tree
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0750"

    - name: Stop legacy Traefik stack if running
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ deploy_dir }}"
        if [ -f docker-compose.yml ] && grep -q 'traefik:' docker-compose.yml; then
          docker compose down || true
        fi
      args:
        executable: /bin/bash
      environment:
        COMPOSE_PROJECT_NAME: "{{ deploy_compose_project }}"
      register: legacy_down
      changed_when: "'Container' in (legacy_down.stderr | default(''))"
      failed_when: false

    - name: Remove legacy Traefik config directories
      ansible.builtin.file:
        path: "{{ deploy_dir }}/traefik"
        state: absent

    - name: Deploy base configuration files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ deploy_dir }}/{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - { src: docker-compose.yml.j2, dest: docker-compose.yml }
        - { src: env.j2, dest: .env, mode: "0600" }
      notify: Restart satellite

    - name: Remove previous satellite build context
      ansible.builtin.file:
        path: "{{ deploy_dir }}/image-build"
        state: absent
      when: satellite_image_source == 'build'

    - name: Create satellite build directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}/image-build"
        state: directory
        mode: "0750"
      when: satellite_image_source == 'build'

    - name: Copy satellite Docker build context files
      ansible.builtin.copy:
        src: "{{ satellite_repo_root }}/{{ item }}"
        dest: "{{ deploy_dir }}/image-build/{{ item }}"
        mode: preserve
      loop:
        - Dockerfile
        - requirements.txt
        - telegram_test_command.py
      when: satellite_image_source == 'build'

    - name: Copy satellite package sources
      ansible.builtin.copy:
        src: "{{ satellite_repo_root }}/satellite/"
        dest: "{{ deploy_dir }}/image-build/satellite/"
        mode: preserve
      when: satellite_image_source == 'build'

    - name: Build satellite image on server
      ansible.builtin.command:
        cmd: docker build -t {{ satellite_image }} .
        chdir: "{{ deploy_dir }}/image-build"
      changed_when: true
      when: satellite_image_source == 'build'

    - name: Login to GHCR (private package)
      ansible.builtin.shell: |
        set -euo pipefail
        printf '%s' "{{ ghcr_pull_token }}" \
          | docker login {{ ghcr_registry }} -u "{{ ghcr_pull_user }}" --password-stdin
      no_log: true
      changed_when: true
      when:
        - satellite_image_source == 'ghcr'
        - (ghcr_pull_user | default('') | length) > 0
        - (ghcr_pull_token | default('') | length) > 0

    - name: Pull satellite image from GHCR
      ansible.builtin.command:
        cmd: docker compose pull satellite
        chdir: "{{ deploy_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ deploy_compose_project }}"
      changed_when: true
      when: satellite_image_source == 'ghcr'

    - name: Check if legacy satellite-bot.service unit exists
      ansible.builtin.stat:
        path: /etc/systemd/system/satellite-bot.service
      register: legacy_bot_unit

    - name: Stop and disable legacy systemd bot (frees 127.0.0.1:{{ satellite_host_port }})
      ansible.builtin.systemd:
        name: satellite-bot.service
        state: stopped
        enabled: false
        daemon_reload: true
      when: legacy_bot_unit.stat.exists

    - name: Stop previous satellite container (releases host port mapping)
      ansible.builtin.command:
        cmd: docker compose stop satellite
        chdir: "{{ deploy_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ deploy_compose_project }}"
      register: stop_prev_container
      changed_when: stop_prev_container.rc == 0
      failed_when: false

    - name: Check satellite host port is free
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ satellite_host_port }}"
        state: stopped
        timeout: 15
      register: satellite_port_free

    - name: Fail if host port still in use
      ansible.builtin.fail:
        msg: >-
          127.0.0.1:{{ satellite_host_port }} занят другим процессом.
          На сервере: ss -tlnp | grep ':{{ satellite_host_port }}'.
          Остановите лишний сервис или задайте свободный satellite_host_port в
          group_vars/all.yml и обновите proxy_pass в nginx.
      when: satellite_port_free is failed

    - name: Start satellite container
      ansible.builtin.command:
        cmd: docker compose up -d satellite
        chdir: "{{ deploy_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ deploy_compose_project }}"
      changed_when: true

    - name: Install ensure-nginx-satellite script
      ansible.builtin.copy:
        src: "{{ satellite_repo_root }}/scripts/ensure-nginx-satellite.sh"
        dest: "{{ deploy_dir }}/scripts/ensure-nginx-satellite.sh"
        mode: "0755"

    - name: Ensure nginx proxies Web App paths to satellite
      ansible.builtin.command:
        cmd: >-
          bash {{ deploy_dir }}/scripts/ensure-nginx-satellite.sh
      environment:
        SATELLITE_HOST_PORT: "{{ satellite_host_port }}"
        NGINX_DOMAIN: "{{ domain }}"
      changed_when: true

  handlers:
    - name: Restart satellite
      ansible.builtin.command:
        cmd: docker compose up -d satellite
        chdir: "{{ deploy_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ deploy_compose_project }}"
