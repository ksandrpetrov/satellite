---
# Все параметры деплоя — без extra-vars на командной строке.
#
# В этой схеме reverse proxy и TLS — внешний nginx на хосте; в Docker крутится
# только сам бот. Контейнер слушает 127.0.0.1:<satellite_host_port> — nginx
# проксирует /connect и /api/calendar/* туда (см. deploy/nginx/).

# --- SSH / пути ---
deploy_dir: /opt/satellite
deploy_compose_project: satellite

# --- Домен (используется только для WEBAPP_BASE_URL в .env) ---
# TLS-сертификат для domain выпускает ваш существующий nginx + certbot, не playbook.
domain: cassinilab.ru

# --- Порт бота на хосте ---
# nginx должен проксировать на http://127.0.0.1:<satellite_host_port>.
# Playbook останавливает legacy satellite-bot.service (systemd), если он
# остался от удалённого systemd-деплоя — иначе 8080 уже занят.
satellite_host_port: 8080

# --- Образ бота ---
# satellite_image_source:
#   build — собрать на сервере из исходников (первый деплой, пока в GHCR нет образа)
#   ghcr  — pull из GHCR (после push в main / GitHub Actions)
satellite_image_source: build
ghcr_registry: ghcr.io
ghcr_image: ksandrpetrov/satellite
# Тег образа: latest, semver или sha-<commit> (должен совпадать с SATELLITE_IMAGE в .env).
image_tag: latest

# Для приватного пакета GHCR (или до того, как сделаете пакет public):
# заполните оба поля, и playbook выполнит docker login ghcr.io на сервере.
# Токен — Personal Access Token (classic) c scope read:packages.
# Оставьте пустыми, если пакет public.
ghcr_pull_user: ""
ghcr_pull_token: ""

# --- Секреты приложения (заполните перед деплоем) ---
telegram_bot_token: "REPLACE_ME"
admin_telegram_ids: "111111111"
# Пустая строка — playbook сгенерирует Fernet-ключ при первом деплое.
token_encryption_key: ""

# --- Настройки бота (см. .env.example) ---
tz_name: Europe/Moscow
hide_all_day_events: true
hide_lunch_events: true
log_level: INFO
bot_workers: 4

# --- Погода (опционально) ---
weather_enabled: true
weather_location: '{"name":"Москва","latitude":55.7558,"longitude":37.6173,"timezone":"Europe/Moscow"}'
weather_show_normal: true
