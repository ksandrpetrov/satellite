# Эталонный compose (генерируется Ansible из templates/docker-compose.yml.j2).
# На сервере живёт копия в deploy_dir (по умолчанию /opt/satellite).
#
# В стеке только бот: TLS и reverse proxy — внешний nginx на хосте
# (см. deploy/nginx/satellite-webapp.conf.example).
name: satellite

services:
  satellite:
    image: ${SATELLITE_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEBAPP_HOST: "0.0.0.0"
      WEBAPP_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - satellite-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  satellite-logs:
