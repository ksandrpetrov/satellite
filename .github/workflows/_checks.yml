name: checks

# Reusable workflow: единая «проверочная» стадия (ruff lint + format + mypy +
# py_compile + pytest). Вызывается из test.yml (на PR) и из deploy.yml (на push
# в main / тег v*). Раньше эти шаги дублировались в двух местах и легко
# расходились — например, deploy.yml не проверял `ruff format`, и неотформа-
# тированный код мог уехать в main без шанса быть пойманным.

on:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements-dev.in
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Generated dependency lock check
        if: matrix.python-version == '3.12'
        run: make lock-check
      - name: Ruff lint
        run: python -m ruff check satellite tests
      - name: Ruff format check
        run: python -m ruff format --check satellite tests
      - name: Mypy
        run: python -m mypy satellite
      - name: Compile check
        run: |
          find satellite tests -name '*.py' ! -name '._*' -print0 \
            | xargs -0 python -m py_compile
      - name: Pytest
        run: python -m pytest -q
