<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подключение календаря</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: var(--tg-theme-bg-color,#fff); color: var(--tg-theme-text-color,#000); }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    label { display: block; margin: 12px 0 4px; font-size: 0.9rem; }
    input, select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; }
    button { width: 100%; margin-top: 12px; padding: 12px; font-size: 1rem; cursor: pointer; }
    .hint { font-size: 0.85rem; opacity: 0.8; margin-top: 8px; }
    .status { margin-top: 16px; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.05); }
    .error { color: #b00020; }
    .ok { color: #0a7; }
  </style>
</head>
<body>
  <h1>Подключение календаря</h1>
  <label for="provider">Провайдер</label>
  <select id="provider">
    <option value="mailru">Mail.ru / Mailroom</option>
    <option value="yandex" disabled>Яндекс (скоро)</option>
  </select>
  <label for="login">Email Mail.ru</label>
  <input id="login" type="email" autocomplete="username" placeholder="you@mail.ru">
  <label for="token">Сервисный токен (пароль приложения)</label>
  <input id="token" type="password" autocomplete="off" placeholder="Пароль для внешних приложений">
  <p class="hint">Создайте пароль приложения в настройках Mail.ru → «Пароли для внешних приложений» → Календарь.</p>
  <button id="connectBtn">Проверить и подключить</button>
  <button id="checkBtn" type="button">Проверить подключение</button>
  <button id="disconnectBtn" type="button">Отключить календарь</button>
  <div id="status" class="status"></div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    const statusEl = document.getElementById('status');
    function showStatus(text, ok) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (ok ? 'ok' : 'error');
    }
    async function api(method, path, body) {
      const initData = tg.initData || '';
      const opts = {
        method,
        headers: {
          'Content-Type': 'application/json',
          'X-Telegram-Init-Data': initData,
        },
      };
      if (body) opts.body = JSON.stringify({ ...body, initData });
      const resp = await fetch(path, opts);
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.message || data.error || 'request_failed');
      return data;
    }
    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        await api('POST', '/api/calendar/connect', {
          provider: document.getElementById('provider').value,
          login: document.getElementById('login').value.trim(),
          app_password: document.getElementById('token').value,
        });
        document.getElementById('token').value = '';
        showStatus('Календарь подключён.', true);
        tg.close();
      } catch (e) {
        showStatus(e.message === 'AUTH_FAILED' ? 'Токен не подошёл. Проверьте email и пароль приложения.' : (e.message || 'Ошибка подключения'), false);
      }
    });
    document.getElementById('checkBtn').addEventListener('click', async () => {
      try {
        const data = await api('GET', '/api/calendar/status');
        showStatus(data.connected ? 'Подключение активно.' : 'Календарь не подключён.', data.connected);
      } catch (e) {
        showStatus('Не удалось проверить подключение.', false);
      }
    });
    document.getElementById('disconnectBtn').addEventListener('click', async () => {
      try {
        await api('DELETE', '/api/calendar/disconnect');
        showStatus('Календарь отключён.', true);
      } catch (e) {
        showStatus('Не удалось отключить календарь.', false);
      }
    });
  </script>
</body>
</html>
