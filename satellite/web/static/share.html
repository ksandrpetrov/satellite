<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Чайка — поделиться</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f5f5f7);
      --text: var(--tg-theme-text-color, #1d1d1f);
      --hint: var(--tg-theme-hint-color, #86868b);
      --button-bg: var(--tg-theme-button-color, #007aff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --separator: rgba(120, 120, 128, 0.2);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 8px 0 4px;
      letter-spacing: -0.02em;
    }
    .subtitle { color: var(--hint); font-size: 0.95rem; margin: 0 0 16px; }
    .preview {
      background: var(--secondary-bg);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .preview img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }
    .status {
      text-align: center;
      color: var(--hint);
      padding: 48px 16px;
    }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button.primary {
      background: var(--button-bg);
      color: var(--button-text);
    }
    button.secondary {
      background: transparent;
      color: var(--button-bg);
      border: 1px solid var(--separator);
    }
    button:disabled { opacity: 0.45; cursor: default; }
    .error { color: #ff3b30; font-size: 0.9rem; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Поделиться</h1>
  <p class="subtitle" id="subtitle">Карточка в стиле Apple — в мессенджеры и соцсети</p>
  <div class="preview" id="preview">
    <div class="status" id="loading">Готовлю карточку…</div>
  </div>
  <div class="actions">
    <button type="button" class="primary" id="shareBtn" disabled>Поделиться</button>
    <button type="button" class="secondary" id="closeBtn">Закрыть</button>
  </div>
  <p class="error" id="error" hidden></p>
  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      const preview = document.getElementById("preview");
      const loading = document.getElementById("loading");
      const shareBtn = document.getElementById("shareBtn");
      const closeBtn = document.getElementById("closeBtn");
      const errorEl = document.getElementById("error");
      const subtitle = document.getElementById("subtitle");

      function parseHash() {
        const raw = (location.hash || "").replace(/^#/, "");
        const params = new URLSearchParams(raw);
        return {
          kind: params.get("kind") || "plan",
          mode: params.get("mode") || "",
          days: params.get("days") || "",
        };
      }

      function connectToken() {
        if (window.__SATELLITE_CONNECT_TOKEN__) {
          return String(window.__SATELLITE_CONNECT_TOKEN__);
        }
        const m = location.pathname.match(/\/share\/([A-Za-z0-9_-]{20,128})/);
        return m ? m[1] : "";
      }

      function initData() {
        return (tg && tg.initData) ? tg.initData : "";
      }

      const labels = {
        plan: "План дня",
        upcoming: "Ближайшие события",
        analytics: "Аналитика недели",
      };

      const spec = parseHash();
      subtitle.textContent = labels[spec.kind] || "Карточка Чайки";

      let pngBlob = null;
      let fileName = "chaika.png";

      async function fetchCard() {
        const qs = new URLSearchParams({ kind: spec.kind });
        if (spec.mode) qs.set("mode", spec.mode);
        if (spec.days) qs.set("days", spec.days);
        const headers = {};
        const init = initData();
        if (init) headers["X-Telegram-Init-Data"] = init;
        const token = connectToken();
        if (token) headers["X-Connect-Token"] = token;
        const res = await fetch("/api/share/card?" + qs.toString(), { headers });
        if (!res.ok) {
          let msg = "Не удалось загрузить карточку";
          try {
            const data = await res.json();
            if (data && data.message) msg = data.message;
          } catch (_) {}
          throw new Error(msg);
        }
        const cd = res.headers.get("Content-Disposition") || "";
        const fnMatch = /filename="([^"]+)"/.exec(cd);
        if (fnMatch) fileName = fnMatch[1];
        return await res.blob();
      }

      function showImage(blob) {
        pngBlob = blob;
        const url = URL.createObjectURL(blob);
        preview.innerHTML = "";
        const img = document.createElement("img");
        img.alt = "Карточка Чайки";
        img.src = url;
        preview.appendChild(img);
        shareBtn.disabled = false;
      }

      function showError(msg) {
        errorEl.hidden = false;
        errorEl.textContent = msg;
        loading.textContent = msg;
      }

      async function shareNative() {
        if (!pngBlob) return;
        const file = new File([pngBlob], fileName, { type: "image/png" });
        const title = labels[spec.kind] || "Чайка";
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title });
          return;
        }
        if (navigator.share) {
          await navigator.share({ title, text: title + " — календарь в Telegram-боте Чайка" });
          return;
        }
        const a = document.createElement("a");
        a.href = URL.createObjectURL(pngBlob);
        a.download = fileName;
        a.click();
      }

      shareBtn.addEventListener("click", function () {
        shareBtn.disabled = true;
        shareNative()
          .catch(function (e) {
            if (e && e.name !== "AbortError") showError(e.message || "Не удалось поделиться");
          })
          .finally(function () { shareBtn.disabled = !pngBlob; });
      });

      closeBtn.addEventListener("click", function () {
        if (tg) tg.close();
        else window.history.back();
      });

      fetchCard()
        .then(showImage)
        .catch(function (e) { showError(e.message || "Ошибка загрузки"); });
    })();
  </script>
</body>
</html>
